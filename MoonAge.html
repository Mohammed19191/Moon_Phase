<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <link rel="stylesheet" href="style.css?v=20261023a">

  <style>
    :root {
      --primary-color: #8E9AAF;
      --secondary-color: #EFD3D7;
      --accent-color: #FEEAFA;
      --bg-color: #0B1026;
      --card-bg: rgba(142, 154, 175, 0.1);
      --text-shadow: 0 0 20px rgba(142, 154, 175, 0.4);
      --star-color: rgba(255, 255, 255, 0.8);
      --body-gradient-start: #0B1026;
      --body-gradient-end: #1A1B36;
    }

    [data-theme="light"] {
      --primary-color: #FF8C42;
      --secondary-color: #2C3E50;
      --accent-color: #FFB74D;
      --bg-color: #F8F9FA;
      --card-bg: rgba(255, 140, 66, 0.1);
      --text-shadow: 0 0 20px rgba(255, 140, 66, 0.3);
      --star-color: rgba(44, 62, 80, 0.6);
      --body-gradient-start: #FF512F;
      --body-gradient-end: #F09819;
    }

    .nebula {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(142, 154, 175, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(142, 154, 175, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(142, 154, 175, 0.02) 0%, transparent 60%);
      pointer-events: none;
      z-index: 1;
    }

    body {
      background: linear-gradient(135deg, var(--body-gradient-start) 0%, var(--body-gradient-end) 100%);
      color: var(--secondary-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    h1, h2 {
      color: var(--accent-color);
      text-shadow: var(--text-shadow);
      letter-spacing: 1px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 25px;
    }

    .moon-container {
      background: var(--card-bg);
      border-radius: 30px;
      padding: 40px;
      margin: 20px auto;
      backdrop-filter: blur(15px);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.1),
        inset 0 0 32px rgba(142, 154, 175, 0.1);
      transition: transform 0.5s ease, box-shadow 0.5s ease;
      max-width: 500px;
      border: 1px solid rgba(142, 154, 175, 0.1);
    }

    .moon-container:hover {
      transform: translateY(-5px);
      box-shadow: 
        0 15px 45px rgba(0, 0, 0, 0.15),
        inset 0 0 32px rgba(142, 154, 175, 0.2);
    }

    .moon-image-wrapper {
      position: relative;
      width: 400px;
      height: 400px;
      margin: 0 auto;
      cursor: pointer;
      transition: all 0.5s ease;
    }

    .moon-link {
      display: block;
      text-decoration: none;
      position: relative;
    }

    .moon-link::after {
      content: 'العودة للصفحة الرئيسية';
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--accent-color);
      font-size: 1rem;
      opacity: 0;
      transition: all 0.3s ease;
      white-space: nowrap;
      text-shadow: var(--text-shadow);
    }

    .moon-link:hover::after {
      opacity: 0.8;
      bottom: -30px;
    }

    img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: all 0.8s ease;
      object-fit: cover;
      filter: brightness(1.1);
    }

    .moon-image-wrapper:hover img {
      transform: scale(1.03) rotate(2deg);
    }

    .phase-name {
      display: none;
      margin-top: 25px;
      font-size: 1.6rem;
      color: var(--accent-color);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s ease forwards;
      text-shadow: var(--text-shadow);
    }

    .age-details {
      background: var(--card-bg);
      border-radius: 30px;
      padding: 40px 40px 30px;
      margin-top: 40px;
      backdrop-filter: blur(15px);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.1),
        inset 0 0 32px rgba(142, 154, 175, 0.1);
      border: 1px solid rgba(142, 154, 175, 0.1);
      transition: all 0.5s ease;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      perspective: 1000px;
      position: relative;
    }

    .age-details:hover {
      box-shadow: 
        0 15px 45px rgba(0, 0, 0, 0.15),
        inset 0 0 32px rgba(142, 154, 175, 0.2);
    }

    .expand-button {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(142, 154, 175, 0.1);
      color: var(--accent-color);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(142, 154, 175, 0.2);
      cursor: pointer;
      backdrop-filter: blur(15px);
      transition: all 0.3s ease;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .expand-button:hover {
      background: rgba(142, 154, 175, 0.2);
      transform: translateX(-50%) translateY(-2px);
    }

    .expand-button i {
      transition: transform 0.3s ease;
    }

    .age-grid {
      max-height: 400px;
      overflow-y: auto;
      margin-top: 30px;
      padding: 20px;
      scroll-behavior: smooth;
      transform-style: preserve-3d;
      transition: max-height 0.5s ease;
    }

    .age-grid.expanded {
      max-height: none;
    }

    .expand-button.expanded i {
      transform: rotate(180deg);
    }

    /* Custom Scrollbar Styling */
    .age-grid::-webkit-scrollbar {
      width: 8px;
    }

    .age-grid::-webkit-scrollbar-track {
      background: rgba(142, 154, 175, 0.1);
      border-radius: 10px;
      margin: 5px;
    }

    .age-grid::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--accent-color) 0%, var(--primary-color) 100%);
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: content-box;
      transition: all 0.3s ease;
    }

    .age-grid::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--primary-color) 0%, var(--accent-color) 100%);
    }

    .age-card {
      background-color: rgba(142, 154, 175, 0.15);
      padding: 25px;
      border-radius: 20px;
      border: 1px solid rgba(142, 154, 175, 0.1);
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(0) translateY(0);
      opacity: 0.8;
      filter: brightness(0.8);
      transition: all 0.5s ease;
    }

@supports ((-webkit-backdrop-filter: blur(5px)) or (backdrop-filter: blur(5px))) {
  .age-card {
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
  }
}

.age-card.visible {
      opacity: 1;
      -webkit-filter: brightness(1);
      filter: brightness(1);
    }

    .age-card:hover {
      -webkit-transform: translateZ(20px) translateY(-10px);
      transform: translateZ(20px) translateY(-10px);
      background: rgba(142, 154, 175, 0.2);
      opacity: 1;
      -webkit-filter: brightness(1.1);
      filter: brightness(1.1);
    }

    .age-card:last-child {
      margin-bottom: 0;
    }

    .age-card .value {
      font-size: 2.2rem;
      color: var(--accent-color);
      margin: 0;
      font-weight: bold;
      text-shadow: var(--text-shadow);
      -webkit-transform: translateZ(10px);
      transform: translateZ(10px);
    }

    .age-card .label {
      color: var(--secondary-color);
      font-size: 1.2rem;
      opacity: 0.9;
      margin-left: 20px;
      -webkit-transform: translateZ(10px);
      transform: translateZ(10px);
    }

    [data-theme="light"] .age-card .value {
      color: var(--secondary-color);
    }

    [data-theme="light"] .age-card .label {
      opacity: 1;
    }

    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(142, 154, 175, 0.1);
      color: var(--accent-color);
      padding: 12px 25px;
      border-radius: 30px;
      text-decoration: none;
      transition: all 0.5s ease;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(142, 154, 175, 0.2);
      font-size: 1.1rem;
      z-index: 3;
    }

    .back-button:hover {
      background: rgba(142, 154, 175, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .back-button i {
      margin-left: 8px;
      transition: transform 0.3s ease;
    }

    .back-button:hover i {
      transform: translateX(-5px);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-10px) rotate(1deg);
      }
    }

    @media (max-width: 768px) {
      .moon-image-wrapper {
        width: 250px;
        height: 250px;
      }

      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1.6rem;
      }

      .age-details {
        padding: 30px 25px 20px;
      }

      .age-grid {
        max-height: 350px;
      }

      .age-card {
      background-color: rgba(142, 154, 175, 0.15);
      padding: 25px;
      border-radius: 20px;
      border: 1px solid rgba(142, 154, 175, 0.1);
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(0) translateY(0);
      opacity: 0.8;
      filter: brightness(0.8);
      transition: all 0.5s ease;
    }

      .age-card::before {
        top: 3px;
        bottom: -3px;
      }

      .age-card::after {
        top: 6px;
        bottom: -6px;
      }
    }

    @media (max-width: 480px) {
      .moon-image-wrapper {
        width: 200px;
        height: 200px;
      }

      .container {
        padding: 10px;

      h1 {
        font-size: 1.5rem;
      }

      h2 {
        font-size: 1.3rem;
      }

      .age-details {
        padding: 25px 20px 15px;
      }

      .age-grid {
        max-height: 300px;
        padding: 15px;
      }

      background-color: rgba(142, 154, 175, 0.15);

      display: flex;
      justify-content: space-between;

      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(0) translateY(0);
      opacity: 0.8;
      filter: brightness(0.8);
      transition: all 0.5s ease;
    }

        top: 2px;
        bottom: -2px;
      }

      .age-card::after {
        top: 4px;
        bottom: -4px;
      }
    }

    /* Zoro Animation and Styling */

    .heart {
      position: absolute;
      font-size: 20px;
      color: #ff6b6b;
      pointer-events: none;
      animation: floatHeart 1s ease-out forwards;
      text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
    }

    /* Navigation Styles */

    .nav-link i {
      font-size: 1.2rem;
      transition: transform 0.3s ease;
    }

    .nav-link:hover i {
      transform: scale(1.1);
    }

    @media (max-width: 768px) {
      .nav-list {
        gap: 15px;
      }

      .nav-link {
        font-size: 1rem;
        padding: 6px 12px;
      }
    }

    /* Theme Toggle Button */

    .theme-toggle i {
      position: absolute;
      transition: all 0.5s ease;
    }

    .theme-toggle .fa-cherry-blossom {
      opacity: 0;
      transform: translateX(20px) translateY(5px) scale(0.7);
      color: #FFB6C1;
      display: none;
    }

    .theme-toggle .sakura-icon {
      opacity: 0;
      transform: translateX(20px) translateY(5px) scale(0.7);
      display: none;
      width: 35px;
      height: 35px;
      background-image: url('images1/sakura.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    [data-theme="light"] .theme-toggle .fa-moon {
      opacity: 0;
      transform: rotate(180deg);
    }

    [data-theme="light"] .theme-toggle .fa-sun {
      opacity: 1;

    }

    [data-theme="light"] .theme-toggle .fa-cloud {
      opacity: 1;

    [data-theme="sakura"] .theme-toggle .fa-moon {
      opacity: 0;
      transform: rotate(180deg);
    }

    [data-theme="sakura"] .theme-toggle .fa-sun {

    }

    [data-theme="sakura"] .theme-toggle .fa-cloud {
      opacity: 0;
      transform: translateX(-20px) translateY(5px) scale(0.7);
    }

    [data-theme="sakura"] .theme-toggle .sakura-icon {
      opacity: 1;
      transform: translateX(0) translateY(0) scale(1.2);
      display: block;
    }

    /* Sakura Theme Variables */

    /* Sakura Branch */

    /* Cloud Styles */
    .cloud {

    /* الجوال: بطاقات العمر كانت تدفع الصفحة إلى عرض أكبر من الشاشة (تمرير أفقي) */

  <script>
    (() => {
      const { moonInfo, showMoon, ar, zoroPet } = SiteKit;
      const START = new Date(2001, 3, 23);

      /* ---- طور القمر: يُحسب محليًا دون أي اتصال بالإنترنت ---- */
      const moonImg = document.getElementById('moonImage');
      const phaseEl = document.getElementById('phaseName');
      const meta = document.createElement('div');
      meta.className = 'phase-meta';
      phaseEl.after(meta);
      moonImg.style.animation = 'float 3s ease-in-out infinite';

      function updateMoon() {
        const m = moonInfo();
        showMoon(moonImg, m);
        phaseEl.textContent = m.phase.name;
        meta.textContent = `عمر القمر ${ar(m.age, 1)} يومًا · الإضاءة نحو ${ar(Math.round(m.illum * 100))}٪`;
      }

      /* ---- بطاقات العمر: تُبنى مرة واحدة ثم يُحدَّث النص فقط ---- */
      const UNITS = [
        { key: 'years', label: 'سنة' }, { key: 'months', label: 'أشهر' }, { key: 'weeks', label: 'أسابيع' },
        { key: 'days', label: 'أيام' }, { key: 'hours', label: 'ساعات' }, { key: 'minutes', label: 'دقائق' },
        { key: 'seconds', label: 'ثواني' }
      ];
      const grid = document.getElementById('moonAgeDetails');
      grid.innerHTML = UNITS.map(u => `
        <div class="age-card">
          <div class="label">${u.label}</div>
          <div class="value" data-unit="${u.key}"></div>
        </div>`).join('');
      const cells = [...grid.querySelectorAll('[data-unit]')];

      function tickAge() {
        const days = (Date.now() - START) / 864e5;
        const v = { years: days / 365.25, months: days / 365.25 * 12, weeks: days / 7, days,
                    hours: days * 24, minutes: days * 1440, seconds: days * 86400 };
        cells.forEach(c => { c.textContent = ar(Math.floor(v[c.dataset.unit])); });
      }

      const cards = grid.querySelectorAll('.age-card');
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver(entries => entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
        }), { threshold: 0.3 });
        cards.forEach(c => io.observe(c));
      } else {
        cards.forEach(c => c.classList.add('visible'));
      }

      /* ---- زر عرض الكل / إخفاء ---- */
      const btn = document.getElementById('expandButton');
      btn.setAttribute('aria-expanded', 'false');
      btn.addEventListener('click', () => {
        const open = grid.classList.toggle('expanded');
        btn.classList.toggle('expanded', open);
        btn.setAttribute('aria-expanded', String(open));
        btn.innerHTML = (open ? 'إخفاء' : 'عرض الكل') + ' ' + SiteKit.icon('chevron');
        if (!open) document.querySelector('.age-details').scrollIntoView({ behavior: 'smooth' });
      });

      updateMoon();
      tickAge();
      setInterval(tickAge, 1000);
      setInterval(updateMoon, 60000);
      zoroPet();
    })();
  </script>
</body>
</html>
