<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شكل القمر اليوم</title>
  <meta name="description" content="شكل القمر اليوم وآية اليوم">
  <meta name="theme-color" content="#0B1026">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%99%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pet.css">
  <link rel="stylesheet" href="quran-player.css">
  <style>
    :root {
      --primary-color: #8E9AAF;
      --secondary-color: #EFD3D7;
      --accent-color: #FEEAFA;
      --bg-color: #0B1026;
      --card-bg: rgba(255, 255, 255, 0.05);
      --text-shadow: 0 0 20px rgba(142, 154, 175, 0.4);
      --star-color: rgba(255, 255, 255, 0.8);
      --body-gradient-start: #0B1026;
      --body-gradient-end: #1A1B36;
      --nebula-opacity: 0.05;
    }

    [data-theme="light"] {
      --primary-color: #FF8C42;
      --secondary-color: #2C3E50;
      --accent-color: #FFB74D;
      --bg-color: #F8F9FA;
      --card-bg: rgba(255, 140, 66, 0.1);
      --text-shadow: 0 0 20px rgba(255, 140, 66, 0.3);
      --star-color: rgba(44, 62, 80, 0.6);
      --body-gradient-start: #FF512F;
      --body-gradient-end: #F09819;
      --nebula-opacity: 0.02;
    }

    .nebula {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(142, 154, 175, var(--nebula-opacity)) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(142, 154, 175, var(--nebula-opacity)) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(142, 154, 175, calc(var(--nebula-opacity) * 0.4)) 0%, transparent 60%);
      pointer-events: none;
      z-index: 1;
      transition: background 0.5s ease;
    }

    body {
      background: linear-gradient(135deg, var(--body-gradient-start) 0%, var(--body-gradient-end) 100%);
      color: var(--secondary-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      transition: background 0.5s ease;
    }

    h1 {
      color: var(--accent-color);
      font-size: 2.5rem;
      margin-bottom: 30px;
      text-shadow: var(--text-shadow);
      letter-spacing: 1px;
    }

    .ayah-container {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 30px;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.1),
        inset 0 0 32px rgba(142, 154, 175, 0.1);
      margin-top: 50px;
      max-width: 800px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(142, 154, 175, 0.1);
      transition: all 0.5s ease;
    }

    .ayah-container:hover {
      box-shadow: 
        0 15px 45px rgba(0, 0, 0, 0.15),
        inset 0 0 32px rgba(142, 154, 175, 0.2);
    }

    .ayah {
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--accent-color);
      line-height: 2;
      position: relative;
      z-index: 1;
      text-shadow: var(--text-shadow);
    }

    .ayah::before {
      content: '"';
      font-size: 5rem;
      color: var(--primary-color);
      opacity: 0.2;
      position: absolute;
      top: -30px;
      right: -20px;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-10px) rotate(1deg);
      }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .ayah {
        font-size: 1.3rem;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 10px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .ayah {
        font-size: 1.2rem;
      }

      .ayah-container {
        padding: 30px 20px;
      }
    }

    /* Add Zoro styles */

    .heart {
      position: absolute;
      font-size: 20px;
      color: #ff6b6b;
      pointer-events: none;
      animation: floatHeart 1s ease-out forwards;
      text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
    }

    /* Navigation Styles */

    .nav-link i {
      font-size: 1.2rem;
      transition: transform 0.3s ease;
    }

    .nav-link:hover i {
      transform: scale(1.1);
    }

    @media (max-width: 768px) {
      .nav-list {
        gap: 15px;
      }

      .nav-link {
        font-size: 1rem;
        padding: 6px 12px;
      }
    }

    /* Theme Toggle Button */

    .theme-toggle i {
      position: absolute;
      transition: all 0.5s ease;
    }

    .theme-toggle .fa-cherry-blossom {
      opacity: 0;
      transform: translateX(20px) translateY(5px) scale(0.7);
      color: #FFB6C1;
      display: none;
    }

    .theme-toggle .sakura-icon {
      opacity: 0;
      transform: translateX(20px) translateY(5px) scale(0.7);
      display: none;
      width: 35px;
      height: 35px;
      background-image: url('images1/sakura.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    [data-theme="light"] .theme-toggle .fa-moon {
      opacity: 0;
      transform: rotate(180deg);
    }

    [data-theme="light"] .theme-toggle .fa-sun {
      opacity: 1;
      transform: rotate(0deg);
    }

    [data-theme="light"] .theme-toggle .fa-cloud {
      opacity: 1;
      transform: translateX(0) translateY(5px) scale(0.7);
      color: white;
    }

    [data-theme="sakura"] .theme-toggle .fa-moon {
      opacity: 0;
      transform: rotate(180deg);
    }

    [data-theme="sakura"] .theme-toggle .fa-sun {
      opacity: 0;
      transform: rotate(180deg);
    }

    [data-theme="sakura"] .theme-toggle .fa-cloud {
      opacity: 0;
      transform: translateX(-20px) translateY(5px) scale(0.7);
    }

    [data-theme="sakura"] .theme-toggle .sakura-icon {
      opacity: 1;
      transform: translateX(0) translateY(0) scale(1.2);
      display: block;
    }

    /* Sakura Theme Variables */

    /* Sakura Branch */

    /* Falling Sakura Leaves */

    /* Add sunset glow effect */
    [data-theme="light"] .nebula {
      background: 
        radial-gradient(circle at 20% 30%, rgba(255, 140, 66, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255, 183, 77, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255, 140, 66, 0.1) 0%, transparent 60%);
    }

    /* Cloud styles */
    .cloud {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.9;
      width: 400px;
      height: 200px;
      background-image: url('images1/cloud.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: blur(3px);
      -webkit-filter: blur(3px);
      display: none;
    }

    [data-theme="light"] .cloud {
      display: block;
    }

    [data-theme="dark"] .cloud,
    [data-theme="sakura"] .cloud {
      display: none;
    }

    .cloud-1 {
      top: 5%;
      left: 10%;
      transform: scale(0.8);
    }

    .cloud-2 {
      top: 15%;
      right: 15%;
      transform: scale(1.2);
    }

    .cloud-3 {
      top: 25%;
      left: 25%;
      transform: scale(0.9);
    }

    .cloud-4 {
      top: 35%;
      right: 30%;
      transform: scale(1.1);
    }

    .cloud-5 {
      top: 45%;
      left: 40%;
      transform: scale(1.0);
    }

    .cloud-6 {
      top: 55%;
      right: 25%;
      transform: scale(0.7);
    }

    .cloud-7 {
      top: 65%;
      left: 15%;
      transform: scale(1.3);
    }

    .cloud-8 {
      top: 75%;
      right: 40%;
      transform: scale(0.8);
    }

    .cloud-9 {
      top: 85%;
      left: 30%;
      transform: scale(1.1);
    }

    .cloud-10 {
      top: 20%;
      right: 10%;
      transform: scale(0.9);
    }
  
    /* القمر في الصفحة الرئيسية */
    .home-moon{margin:10px auto 0;display:flex;flex-direction:column;align-items:center;gap:6px}
    .home-moon img{width:220px;height:220px;object-fit:contain;animation:float 3s ease-in-out infinite;

    .home-moon-meta{font-size:1rem;opacity:.85}
    @media (max-width:480px){.home-moon img{width:170px;height:170px}}
  
    [data-theme="sakura"] .home-moon-meta { color: var(--accent-color); }
  </style>

    <h1>شكل القمر اليوم</h1>

    <section class="home-moon" aria-live="polite">
      <a href="MoonAge.html" title="عمر القمر"><img id="homeMoon" alt="شكل القمر اليوم" width="220" height="220"></a>
      <div class="home-moon-name" id="homeMoonName"></div>
      <div class="home-moon-meta" id="homeMoonMeta"></div>

  <div class="sakura-branch"></div>

  <script src="site.js"></script>
  <script src="quran-player.js"></script>
  <script>
    (() => {
      const { moonInfo, showMoon, ar, zoroPet } = SiteKit;
      const FALLBACK = { ayah: 'إِنَّ مَعَ الْعُسْرِ يُسْرًا (الشرح: 6)', surah: 94, verse: 6, complete: true };
      const ayahEl = document.getElementById('ayah');
      let ayat = null, shownDay = null, fallbackShown = false;
      const player = QuranPlayer.mount(document.getElementById('ayahPlayer'));

      // رقم اليوم منذ 1970 — يمرّ على كل الآيات بالتتابع دون تكرار حتى تكتمل الدورة
      const dayNumber = () => {
        const d = new Date();
        return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
      };

      function showAyah(entry) {
        ayahEl.style.transition = 'none';
        ayahEl.style.opacity = '0';
        ayahEl.textContent = entry.ayah;
        player.setAyah(entry);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          ayahEl.style.transition = 'opacity 1s ease-in-out';
          ayahEl.style.opacity = '1';
        }));
      }

      async function updateAyah() {
        const day = dayNumber();
        if (day === shownDay) return;
        try {
          if (!ayat) {
            const res = await fetch('ayat.json');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            ayat = await res.json();
          }
          showAyah(ayat[day % ayat.length]);
          shownDay = day;
        } catch (err) {
          console.error('تعذر تحميل الآيات:', err);
          if (!fallbackShown && shownDay === null) { showAyah(FALLBACK); fallbackShown = true; }
        }
      }

      const moonImg = document.getElementById('homeMoon');
      const nameEl = document.getElementById('homeMoonName');
      const metaEl = document.getElementById('homeMoonMeta');
      function updateMoon() {
        const m = moonInfo();
        showMoon(moonImg, m);
        nameEl.textContent = m.phase.name;
        metaEl.textContent = `عمر القمر ${ar(m.age, 1)} يومًا · الإضاءة نحو ${ar(Math.round(m.illum * 100))}٪`;
      }

      const refresh = () => { updateAyah(); updateMoon(); };
      refresh();
      setInterval(refresh, 60000);                       // يلتقط تغيّر اليوم عند منتصف الليل
      document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
      zoroPet();
    })();
  </script>
